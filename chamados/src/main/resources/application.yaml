spring:
  application:
    name: chamados
  datasource:
    url: jdbc:postgresql://localhost:5432/chamados
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
    hibernate:
      ddl-auto: update
  data:
    web:
      pageable:
        max-page-size: 50